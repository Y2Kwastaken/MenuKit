[versions]
jspecify-version = "1.0.0"
junit-version = "5.14.4"
mockito-version = "5.23.0"
papermc-version = "1.21.8-R0.1-SNAPSHOT"
run-paper-version = "2.3.1"
shadow-version = "9.0.0-rc1"

[libraries]
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify-version" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit-version" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito-version" }
mockito-junit-jupiter = { group = "org.mockito", name = "mockito-junit-jupiter", version.ref = "mockito-version" }
papermc = { group = "io.papermc.paper", name = "paper-api", version.ref = "papermc-version" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper-version" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow-version" }
